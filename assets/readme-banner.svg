<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Hriduan Omor Siam E-Portfolio banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0c1a"/>
      <stop offset="1" stop-color="#07060d"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#8b7bff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c084fc" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <style>
      .flow { stroke-dasharray: 6 10; animation: flow 3s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes flow  { to { stroke-dashoffset: -64; } }
      @keyframes pulse { 50% { opacity: .3; transform: scale(.7); } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glowA)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glowB)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".10"/>

  <!-- circuit traces running to the chip -->
  <g fill="none" stroke="#8b7bff" stroke-width="1.6" stroke-opacity=".8" class="flow">
    <path d="M700 110 H820 L850 140 H900"/>
    <path d="M700 150 H790 L815 170 H900"/>
    <path d="M700 190 H790 L815 170"/>
    <path d="M700 230 H820 L850 200 H900"/>
    <path d="M1100 140 H1150 L1170 120 V70"/>
    <path d="M1100 170 H1170 V230"/>
    <path d="M1100 200 H1140 L1160 220 V290"/>
  </g>
  <g fill="#f2c66d">
    <circle class="pulse" cx="700" cy="110" r="4"/>
    <circle class="pulse" cx="700" cy="150" r="4" style="animation-delay:.4s"/>
    <circle class="pulse" cx="700" cy="190" r="4" style="animation-delay:.8s"/>
    <circle class="pulse" cx="700" cy="230" r="4" style="animation-delay:1.2s"/>
    <circle class="pulse" cx="1170" cy="70" r="4" style="animation-delay:.6s"/>
    <circle class="pulse" cx="1170" cy="230" r="4" style="animation-delay:1s"/>
    <circle class="pulse" cx="1160" cy="290" r="4" style="animation-delay:1.4s"/>
  </g>

  <!-- the chip -->
  <g>
    <g stroke="#f2c66d" stroke-width="3" stroke-linecap="round">
      <path d="M930 96v-16M965 96v-16M1000 96v-16M1035 96v-16M1070 96v-16"/>
      <path d="M930 244v16M965 244v16M1000 244v16M1035 244v16M1070 244v16"/>
      <path d="M896 130h-16M896 170h-16M896 210h-16"/>
      <path d="M1104 130h16M1104 170h16M1104 210h16"/>
    </g>
    <rect x="900" y="96" width="204" height="148" rx="16" fill="#120f24" stroke="#8b7bff" stroke-width="2.5"/>
    <rect x="916" y="112" width="172" height="116" rx="9" fill="none" stroke="#8b7bff" stroke-opacity=".45"/>
    <circle cx="928" cy="124" r="4" fill="#f2c66d"/>
    <text x="1002" y="176" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="44" fill="#ffffff">EEE</text>
    <text x="1002" y="200" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#f2c66d" letter-spacing="1">RTL  to  Silicon</text>
  </g>

  <!-- text -->
  <text x="60" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#f2c66d" letter-spacing="4">E-PORTFOLIO  ·  2026</text>
  <text x="60" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="60" font-weight="700" fill="url(#grad)">Hriduan Omor Siam</text>
  <text x="60" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="22" fill="#efedf8">Electrical &amp; Electronic Engineering student</text>
  <text x="60" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#a29fbd">Chip design  ·  RTL verification  ·  PV cells  ·  Electronics projects</text>
  <rect x="60" y="272" width="180" height="4" rx="2" fill="url(#grad)"/>
  <rect x="246" y="272" width="26" height="4" rx="2" fill="#f2c66d"/>
</svg>
